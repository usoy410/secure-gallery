name: Python CI

on:
  push:
    branches:
      - master
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'ml/**'
      - 'validation/**'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'ml/**'
      - 'validation/**'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/python.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install tesseract (OCR check in ml/generate tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run tests with pytest
        run: |
          pytest
