name: Android CI

on:
  push:
    branches:
      - master
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The detector model (assets/detector.tflite) is stored with Git LFS.
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build, Test (JVM + Robolectric) & Lint
        run: |
          cd android
          ./gradlew assembleDebug testDebugUnitTest lint -Proborazzi.test.record=true

      - name: Verify offline manifest (no INTERNET permission)
        run: |
          MANIFEST_FILE=$(find android/app/build/intermediates/merged_manifest* -name "AndroidManifest.xml" | head -n 1)
          if [ -z "$MANIFEST_FILE" ]; then
            echo "::error::Merged debug AndroidManifest.xml not found!"
            exit 1
          fi
          echo "Inspecting merged manifest at: $MANIFEST_FILE"
          # Strip XML comments first so a comment that names the permission does not match.
          if perl -0pe 's/<!--.*?-->//gs' "$MANIFEST_FILE" | grep -i "android.permission.INTERNET"; then
            echo "::error::Merged manifest contains forbidden android.permission.INTERNET!"
            exit 1
          fi
          echo "Verified: Merged debug manifest does not contain android.permission.INTERNET"

      - name: Upload Roborazzi screenshot test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roborazzi-screenshots
          path: |
            android/app/build/outputs/roborazzi/
            android/app/src/test/snapshots/
          if-no-files-found: warn

  emulator-test:
    name: Connected Emulator Tests (API 34)
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Check if emulator test should run
        id: filter
        run: |
          # Always run on scheduled nightly builds or manual triggers
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Triggered by ${{ github.event_name }}: running connected emulator tests."
            exit 0
          fi

          # On pull requests, check if changed files touch vault/, scan/, or MediaStore
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            DIFF_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || git diff --name-only origin/master HEAD || true)
            echo "Changed files in PR:"
            echo "$DIFF_FILES"

            if echo "$DIFF_FILES" | grep -E 'android/app/src/main/java/.*/(vault|scan)/|MediaStore|androidTest'; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "PR touches vault/, scan/, MediaStore, or androidTest: running emulator tests."
              exit 0
            fi
          fi

          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "Skipping connected emulator tests to preserve CI minutes."

      - name: Set up JDK 21
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Enable KVM group perms
        if: steps.filter.outputs.should_run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The API 34 image needs about 7.4 GB for its data partition; hosted runners can have
      # less free. Drop preinstalled toolchains this job never uses.
      - name: Free disk space for the emulator
        if: steps.filter.outputs.should_run == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Run connected tests in Android Emulator
        if: steps.filter.outputs.should_run == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # The tests need little space; a 4 GB data partition fits on any runner.
          disk-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Each script line runs in its own shell, so cd and gradlew share one line.
          # RedactionInstrumentedTest (#18) leaves the redacted copies and their boxes in
          # Download/, which outlives the test APK; the leak-test job below judges them.
          script: |
            cd android && ./gradlew connectedDebugAndroidTest
            adb pull /sdcard/Download/sg-redaction-export android/redaction-export

      - name: Upload redacted copies from the emulator
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: device-redactions
          path: android/redaction-export/
          if-no-files-found: error

  device-leak-test:
    name: Leak Test on Device Redactions
    needs: emulator-test
    if: needs.emulator-test.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core fonts-liberation \
            libgl1 libglib2.0-0

      - name: Cache PaddleOCR models (leak-test judge)
        uses: actions/cache@v4
        with:
          path: ~/.paddlex/official_models
          key: paddlex-${{ hashFiles('validation/leaktest/ocr.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,leaktest]"

      - name: Download redacted copies
        uses: actions/download-artifact@v4
        with:
          name: device-redactions
          path: device-redactions

      # D11 (pixels, opacity) and D13 (EXIF thumbnail, metadata) on the app's real output,
      # judged against the fixtures' ground-truth labels.
      - name: Run the leak test
        run: |
          ls device-redactions
          python -m validation.leaktest device-redactions \
            --labels android/app/src/androidTest/assets/redaction --out leak-results --fail-on-leak

      - name: Upload leak-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-leak-results
          path: leak-results/
          if-no-files-found: warn
