[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-gallery"
version = "0.1.0"
description = "Secure Gallery: offline layout-anchored redaction, leak testing, and synthetic benchmark"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
dependencies = [
    "faker==33.1.0",
    # ml.generate imports templates.validate during normal dataset generation.
    "jsonschema==4.23.0",
    # ml.renderer measures the watermark with NumPy (#34). A range, not a pin: the leaktest
    # extras (PaddleX) need numpy<2.4 and the train extras pin 2.4.6.
    "numpy>=1.24,<3",
    "pillow==11.1.0",
    "qrcode==8.0",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "matplotlib==3.10.8",
    "pytesseract==0.3.13",
    "pytest==8.3.4",
    "ruff==0.8.4",
]
leaktest = [
    "paddlepaddle==3.3.1",
    "paddleocr==3.7.0",
]
test = [
    "pytesseract==0.3.13",
    "pytest==8.3.4",
]
train = [
    # litert-torch 0.9.x needs torch<2.12; 0.10.0 works with the torch pinned below.
    "ai-edge-litert==2.3.0",
    "litert-torch==0.10.0",
    "numpy==2.4.6",
    "opencv-python==5.0.0.93",
    "pillow==11.1.0",
    "pyyaml==6.0.2",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "ultralytics==8.4.183",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "validation*"]

[tool.setuptools.package-data]
"ml" = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "ml", "validation", "templates"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Notebook cells hold long shell commands (!python -m ...) that cannot be wrapped.
"*.ipynb" = ["E501"]
