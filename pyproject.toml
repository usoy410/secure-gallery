[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-gallery"
version = "0.1.0"
description = "Secure Gallery: offline layout-anchored redaction, leak testing, and synthetic benchmark"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
dependencies = [
    "faker==33.1.0",
    "pillow==11.1.0",
    "qrcode==8.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema==4.23.0",
    "pytesseract==0.3.13",
    "pytest==8.3.4",
    "ruff==0.8.4",
]
test = [
    "jsonschema==4.23.0",
    "pytesseract==0.3.13",
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "validation*"]

[tool.setuptools.package-data]
"ml" = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "ml", "validation", "templates"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []
